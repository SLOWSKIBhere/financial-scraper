name: Pipeline regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run offline tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate checked-in reports can be parsed for sync
        run: |
          python scripts/notion_sync.py --dry-run \
            --report financial_report.json RSS \
            --report community_report.json Community
