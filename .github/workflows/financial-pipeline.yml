name: Financial collection and Notion sync

on:
  schedule:
    - cron: "5 8 * * *"
      timezone: "America/New_York"
    - cron: "5 12 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline segment to run
        required: true
        default: all
        type: choice
        options:
          - all
          - rss
          - community

permissions:
  contents: write

concurrency:
  group: financial-pipeline-main
  cancel-in-progress: false

env:
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN || secrets.NOTION_ACCESS_TOKEN || secrets.NOTION_API_KEY }}
  NOTION_DB_ID: ${{ secrets.NOTION_DB_ID || vars.NOTION_DB_ID }}
  NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || vars.NOTION_DATA_SOURCE_ID }}
  PYTHONUNBUFFERED: "1"

jobs:
  collect-sync-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Resolve scheduled mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode="${{ inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "5 8 * * *" ]]; then
            mode="community"
          else
            mode="rss"
          fi
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"

      - name: Run offline regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Collect, validate, and sync
        run: python scripts/pipeline.py --mode "${{ steps.mode.outputs.mode }}" --sync

      - name: Commit fresh reports
        shell: bash
        run: |
          git config user.name "financial-scraper[bot]"
          git config user.email "financial-scraper[bot]@users.noreply.github.com"
          mode="${{ steps.mode.outputs.mode }}"
          if [[ "$mode" == "rss" || "$mode" == "all" ]]; then
            git add -f financial_report.json collect_metrics.json
          fi
          if [[ "$mode" == "community" || "$mode" == "all" ]]; then
            git add -f community_report.json
          fi
          if git diff --cached --quiet; then
            echo "No report changes to publish."
            exit 0
          fi
          git commit -m "data: automated ${mode} refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: financial-pipeline-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            financial_report.json
            community_report.json
            collect_metrics.json
            scraper.log
            community_feeds.log

      - name: Record failure prominently
        if: failure()
        shell: bash
        run: |
          echo "## Financial pipeline failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: ${{ steps.mode.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
